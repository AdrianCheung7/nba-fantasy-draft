<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft advisor</title>
<style>
  /* Streamlit's palettes: dark by default, light via prefers-color-scheme */
  :root { color-scheme: dark light; --bg: #0e1117; --bg2: #262730; --fg: #fafafa; --mute: #a3a8b8; --line: rgba(250,250,250,.2);
          --accent: #ff4b4b; --go: #21c354; --go-bg: rgba(33,195,84,.2); --warn-bg: rgba(255,227,18,.2); --warn-fg: #ffffc2;
          --bad-bg: #b3261e; --bad-fg: #fff; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --bg2: #f0f2f6; --fg: #31333f; --mute: #5a5e6b; --line: rgba(49,51,63,.2);
            --go: #1a9c42; --go-bg: rgba(33,195,84,.22); --warn-bg: rgba(255,227,18,.35); --warn-fg: #7d5a00;
            --bad-bg: #d92d20; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px; max-width: 360px; overflow-x: hidden; background: var(--bg); color: var(--fg);
         font: 14px/1.4 "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif; }
  h2 { font-size: 12px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
  .banner { padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; font-weight: 600; }
  .down { background: var(--bad-bg); color: var(--bad-fg); }
  .warn { background: var(--warn-bg); color: var(--warn-fg); }
  .reset { background: var(--bg2); border: 1px solid var(--accent); }
  .turn { padding: 10px; border-radius: 6px; background: var(--bg2); font-size: 16px; font-weight: 600; }
  .turn.mine { background: var(--go); color: #0e1117; font-size: 28px; text-align: center; letter-spacing: .03em; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  th, td { padding: 4px 3px; border-bottom: 1px solid var(--line); text-align: right; }
  th { background: var(--bg2); font-weight: 600; font-size: 12px; white-space: nowrap; }
  th:nth-child(2), td:nth-child(2) { text-align: left; overflow-wrap: anywhere; }
  td:nth-child(3) { font-size: 12px; }
  th:first-child, td:first-child { text-align: center; color: var(--mute); }
  tr.best td { background: var(--go-bg); font-weight: 600; }
  tr.best td:first-child { color: var(--fg); }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--mute); }
  details.roster summary { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-block; margin: 0 4px 4px 0; padding: 1px 9px; border-radius: 12px; background: var(--bg2);
          border: 1px solid var(--accent); font-weight: 600; }
  .mute { color: var(--mute); }
  #note { margin-top: 4px; font-size: 12px; color: var(--mute); }
  #foot { margin-top: 14px; font-size: 12px; color: var(--mute); text-align: center; }
  [hidden] { display: none !important; }
  .inj { color: #ff4b4b; font-size: 11px; font-weight: 600; }
</style>
<div id="down" class="banner down" hidden>App not running &mdash; double-click Start Draft App</div>
<div id="ok" hidden>
  <div id="reset" class="banner reset" hidden>New draft &mdash; picks cleared</div>
  <div id="warn" class="banner warn" hidden></div>
  <div id="turn" class="turn"></div>
  <div id="body">
    <h2>Top 5</h2>
    <table>
      <colgroup><col style="width:22px"><col><col style="width:48px"><col style="width:40px"><col style="width:40px"><col style="width:52px"></colgroup>
      <thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Pts/g</th><th>Value</th><th>% back</th></tr></thead>
      <tbody id="top"></tbody>
    </table>
    <details id="morebox" hidden>
      <summary>more</summary>
      <table>
        <colgroup><col style="width:22px"><col><col style="width:48px"><col style="width:40px"><col style="width:40px"><col style="width:52px"></colgroup>
        <tbody id="more"></tbody>
      </table>
    </details>
    <div id="note"></div>
    <h2>Still need</h2>
    <div id="needs"></div>
    <h2>My roster</h2>
    <details class="roster"><summary id="rosterSum"></summary><div id="roster"></div></details>
  </div>
  <div id="foot"></div>
</div>
<script src="panel.js"></script>
<script src="sidepanel.js"></script>
